<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101418" />
    <title>Pushy</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0d10;
        color: #f3f3f3;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
      }
      .screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(11, 13, 16, 0.85);
        backdrop-filter: blur(4px);
      }
      .screen-inner {
        text-align: center;
        padding: 24px;
      }
      .title {
        font-size: 48px;
        margin: 0 0 8px;
        letter-spacing: 2px;
      }
      .subtitle {
        opacity: 0.75;
        margin: 0 0 24px;
      }
      .home-footer {
        margin: 32px 0 0;
        font-size: 12px;
        opacity: 0.5;
      }
      .btn {
        display: block;
        width: 220px;
        margin: 12px auto;
        padding: 14px 18px;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid #2c3038;
        background: #1a1d22;
        color: #f3f3f3;
        font-size: 18px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .btn.primary {
        background: #ffd24a;
        color: #101418;
        border-color: #ffd24a;
        font-weight: 600;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .hud {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        left: 0;
        right: 0;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 16px;
        pointer-events: none;
        z-index: 10;
      }
      .hud-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hud-mute-slot {
        display: flex;
        align-items: center;
        pointer-events: auto;
      }
      .hud.is-hidden .hud-row {
        display: none;
      }
      .hud-row {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .hud-label {
        opacity: 0.7;
      }
      .hud-value {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .mute-btn {
        width: 36px;
        height: 36px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(16, 20, 24, 0.7);
        color: #f5f7fa;
        font-size: 18px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        pointer-events: auto;
        padding: 0;
      }
      .mute-btn:hover {
        background: rgba(32, 38, 44, 0.85);
      }
      .mute-btn.is-muted {
        opacity: 0.7;
      }
      .drop-slots {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
      }
      .drop-slot {
        position: absolute;
        border-radius: 14px;
        border: 2px dashed rgba(255, 210, 74, 0.55);
        background: rgba(255, 210, 74, 0.1);
        color: transparent;
        /* Visual marker only — taps are caught by the full-height zone below. */
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .drop-slot-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        padding: 0;
        margin: 0;
        border: none;
        background: transparent;
        color: transparent;
        cursor: pointer;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .drop-slot-zone:active + .drop-slot,
      .drop-slot.is-pressed {
        background: rgba(255, 210, 74, 0.18);
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
